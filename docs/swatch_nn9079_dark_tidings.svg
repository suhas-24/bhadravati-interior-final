<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Birla Opus NN9079 Dark tidings screen swatch</title>
  <desc id="desc">A screen-reference swatch for NN9079 Dark tidings. Confirm with a physical Birla Opus sample before procurement.</desc>
  <rect width="1200" height="520" fill="#F7F3EC"/>
  <rect x="64" y="56" width="1072" height="260" rx="6" fill="#4F4A47" stroke="#302D2B" stroke-width="2"/>
  <text x="96" y="150" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#F7F3EC">NN9079</text>
  <text x="96" y="205" font-family="Arial, sans-serif" font-size="30" fill="#F7F3EC">Dark tidings</text>
  <text x="96" y="265" font-family="Arial, sans-serif" font-size="22" fill="#F7F3EC">RGB 79, 74, 71 · #4F4A47 · LRV 7.1%</text>
  <text x="64" y="380" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2C2925">ROOFLINE EDGE CONCEPT ACCENT</text>
  <text x="64" y="425" font-family="Arial, sans-serif" font-size="20" fill="#5E574F">Screen reference only — verify the physical Birla Opus exterior sample before ordering.</text>
  <text x="64" y="466" font-family="Arial, sans-serif" font-size="18" fill="#7C7369">Use only on the thin coping/roofline edge; never as a broad wall field.</text>
</svg>

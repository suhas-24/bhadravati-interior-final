<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bhadravati Studio — Interior Design Handover Experience</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --ink:#3d3630; --paper:#f6f1e9; --card:#ffffff; --line:#e2d9cc; --accent:#8a7968;
  --nn9074:#B5AB9C; --latte:#A49483; --slate:#575D5C; --idria:#3D483C; --granite:#1a1a1a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:14px;font-weight:700}
.badge{font-size:10px;background:var(--idria);color:#fff;padding:3px 8px;border-radius:10px;letter-spacing:.4px}
.tabs{display:flex;gap:6px;margin-left:8px;flex-wrap:wrap}
.tab{font-size:12px;padding:6px 13px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--idria);color:#fff;border-color:var(--idria)}
.right{margin-left:auto;display:flex;gap:10px;font-size:11.5px;align-items:center}
label.tg{display:flex;gap:4px;align-items:center;cursor:pointer}
input{accent-color:var(--accent)}
main{flex:1;position:relative;overflow:hidden}

/* ---------- RENDER VIEW ---------- */
.rv{position:absolute;inset:0;display:none;overflow:auto;background:#111}
.rv.on{display:block}
.rv img.hero{width:100%;height:auto;display:block;min-height:60%}
.rv .bar{position:sticky;top:0;display:flex;gap:8px;padding:10px 14px;background:rgba(17,17,17,.82);backdrop-filter:blur(6px);z-index:3;flex-wrap:wrap}
.chip{font-size:11.5px;color:#eee;padding:5px 11px;border:1px solid #555;border-radius:999px;cursor:pointer;background:transparent}
.chip.on{background:#e8e2d8;color:#222;border-color:#e8e2d8}
.rv .meta{padding:16px 20px;background:#fff;border-top:4px solid var(--idria);font-size:12.5px;line-height:1.6}
.rv .meta b{color:var(--idria)}
.kv{display:inline-block;margin:3px 10px 0 0;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:11.5px}
.kv b{color:var(--idria)}

/* ---------- PLAN / 3D ---------- */
#stage{position:absolute;inset:0;display:none}
#stage.on{display:block}
svg{width:100%;height:100%;display:block}
#tip{position:fixed;pointer-events:none;background:#2e2a25;color:#f2ede5;padding:6px 10px;border-radius:8px;font-size:12px;opacity:0;z-index:9;transition:opacity .1s}
#hud{position:absolute;left:12px;bottom:10px;font-size:11px;color:#8a8378;background:rgba(255,255,255,.9);padding:4px 10px;border-radius:8px;border:1px solid var(--line)}

/* ---------- 3D ---------- */
#c3d{position:absolute;inset:0;display:none}
#c3d.on{display:block}
canvas{display:block}
#load{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--paper);color:#7a7266;font-size:13px;z-index:15}

/* spec card shared */
#card{position:absolute;right:12px;top:56px;width:300px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:none;box-shadow:0 8px 24px rgba(61,54,48,.16);z-index:8}
#card h3{font-size:13px;color:var(--idria);margin-bottom:8px}
#card table{width:100%;border-collapse:collapse;font-size:11.5px}
#card td{padding:3px 0;border-top:1px solid var(--line)}
#card td:last-child{text-align:right;font-weight:600}
#card .src{font-size:10px;color:#8a8378;margin-top:8px;line-height:1.4}
#card .x{float:right;cursor:pointer;color:#999;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>Bhadravati Studio · Handover</h1>
  <span class="badge">QA-PASSED RENDERS · MM-LOCKED MODEL</span>
  <div class="tabs" id="tabs">
    <button class="tab on" data-v="renders">Renders</button>
    <button class="tab" data-v="plan">Plan 2D</button>
    <button class="tab" data-v="three">Model 3D</button>
  </div>
  <div class="right">
    <label class="tg"><input type="checkbox" id="tDims"> Dims</label>
    <label class="tg"><input type="checkbox" id="tZones"> Zones</label>
    <button id="mode" style="font-size:11.5px;padding:5px 10px;border:1px solid var(--line);background:#fff;border-radius:8px">☾ Evening 3000K</button>
  </div>
</header>

<main>
  <!-- ============ RENDER TABS ============ -->
  <section class="rv on" id="rv-renders">

    <img class="hero" id="hero" alt="render">
    <div class="meta" id="meta"></div>

<svg id="plan" viewBox="-800 -800 11400 9400" xmlns="http://www.w3.org/2000/svg">

</svg>
<div id="tip"></div>
<div id="hud">scroll = zoom · drag = pan · double-click = reset · click furniture for locked specs</div>

  <!-- ============ 3D MODEL ============ -->
  <section id="c3d"><div id="load">loading 3D engine… needs internet for CDN</div></section>
  <div id="card"></div>

 box(120,H,D,M(0xB5AB9C,.96),-60,H/2,D/2);
 box(120,H,D,M(0xB5AB9C,.96),W+60,H/2,D/2);
 // kitchen
 const kx=(K.x0+K.x1)/2,klen=K.y1-K.y0,kz0=K.y0,latte=M(0xA49483,.85),gran=M(0x1A1A1A,.4,.2);

 // wardrobe (leaves face south)

 Wd.leaves.forEach(lw=>{box(lw-8,Wd.h,52,M(0x46524a,.7),lxp+lw/2-4,Wd.h/2,wz0+26);lxp+=lw;});
 // BED headboard WEST: length runs east, headboard at x=BED.x0

 box(BED.w-170,220,BED.l-120,M(0xe8ddca,.95),BED.x0+90+(BED.w-90)/2,430,BED.z0+BED.l/2);
 [[BED.z0-300],[BED.z0+BED.l+300]].forEach(([nz])=>box(480,520,480,M(0xA49483,.85),BED.x0-240,260,nz+240));
 // sofa/tv/coffee/desk/fridge quick solids

 box(TV.l,425,TV.d,M(0x575D5C,.8),TV.x0+TV.l/2,662,TV.z0+TV.d/2);

 // camera + loop
 cam.position.set(12500,9500,13500);controls.target.set(3200,700,2700);
 (function tick(){requestAnimationFrame(tick);controls.update();renderer.render(scene,cam);})();
 window.__go3D=(name)=>{
  const P={overview:[[12500,9500,13500],[3200,700,2700]],living:[[3888,1600,-2200],[3888,800,2500]],
   kitchen:[[2600,1700,2246],[6200,900,2246]],wardrobe:[[3200,1500,600],[3200,1100,5100]],
   bedroom:[[3600,1800,4900],[1300,500,1900]],study:[[5300,1600,2200],[5350,800,4300]]}[name];
  if(P){cam.position.set(...P[0]);controls.target.set(...P[1]);}};
 window.__mode3D=(on)=>{hemi.intensity=on?.22:.85;sun.intensity=on?0:.9;warm.intensity=on?.9:0;
  scene.background.set(on?0x191510:0xefe9df);};

/* ================= TABS & CONTROLS ================= */
const card=document.getElementById('card');
function showCard(k){const i=INFO[k];if(!i)return;
 card.innerHTML=`<span class="x" onclick="this.parentElement.style.display='none'">×</span><h3>${i.t}</h3>
 ${(i.rows||[]).map(r=>`<table><tr><td>${r[0]}</td><td>${r[1]}</td></tr></table>`).join('')}
 ${i.t2?`<p style='margin-top:6px;font-size:12px'>${i.t2}</p>`:''}<div class='src'>source: ${i.s}</div>`;
 card.style.display='block';}
document.getElementById('tabs').addEventListener('click',e=>{
 const v=e.target.dataset.v;if(!v)return;
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
 document.querySelectorAll('.rv,#stage,#c3d').forEach(s=>s.classList.toggle('on',false));
 document.getElementById({renders:'rv-renders',plan:'stage',three:'c3d'}[v]).classList.add('on');
 if(v==='three'){const l=document.createElement('div');l.id='load';l.style.display='flex';
  l.textContent='loading 3D engine… needs internet for CDN';document.getElementById('c3d').appendChild(l);loadThree();}
});
document.getElementById('tDims').addEventListener('change',e=>dg.setAttribute('visibility',e.target.checked?'visible':'hidden'));
document.getElementById('tZones').addEventListener('change',e=>zg.setAttribute('visibility',e.target.checked?'visible':'hidden'));
document.getElementById('mode').addEventListener('click',e=>{
 const on=e.target.textContent.includes('Evening');e.target.textContent=on?'☀ Daylight':'☾ Evening 3000K';
 if(window.__mode3D)window.__mode3D(on);});
// pan/zoom svg
let vb=svg.viewBox.baseVal,pan=false,p0=null;const stg=document.getElementById('stage');
stg.addEventListener('wheel',e=>{e.preventDefault();const k=e.deltaY>0?1.12:.89,r=svg.getBoundingClientRect();
 const ux=vb.x+(e.clientX-r.left)/r.width*vb.width,uy=vb.y+(e.clientY-r.top)/r.height*vb.height;
 vb.x=ux-(ux-vb.x)*k;vb.y=uy-(uy-vb.y)*k;vb.width*=k;vb.height*=k;},{passive:false});
stg.addEventListener('mousedown',e=>{pan=true;p0=[e.clientX,e.clientY,vb.x,vb.y];});
window.addEventListener('mousemove',e=>{if(!pan)return;const r=svg.getBoundingClientRect();
 vb.x=p0[2]-(e.clientX-p0[0])/r.width*vb.width;vb.y=p0[3]-(e.clientY-p0[1])/r.height*vb.height;});
window.addEventListener('mouseup',()=>pan=false);
stg.addEventListener('dblclick',()=>Object.assign(vb,{x:-800,y:-800,width:11400,height:9400}));
</script>

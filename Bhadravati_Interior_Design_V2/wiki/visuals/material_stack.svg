<rect width="980" height="420" fill="#F4EFE7"/>
<text x="28" y="28" class="t" font-size="17">Material stack — this house</text>
<text x="28" y="46" class="s" font-size="10">0.8 mm StarLine telegraphs core gaps. Both faces. Machine ABS. Recessed pull wrapped. Conceptual.</text>

